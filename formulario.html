<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Página Formulário de Marcelo Quadros  Fundamentos da Web Dinâmica.">
    <meta name="author" content="Marcelo Quadros">
    <link rel="stylesheet" href="estilos/formulario.css">
    <!-- Vinculação do JS com DEFER -->
    <script src="scripts/formulario.js" defer></script>
    
    <title>Avaliação de Produto</title>
    
</head>
<body>
     <!-- Elemento HEADER único adicionado aqui dentro do body e antes do footer -->
    <header>
        <h1>Avaliação de Produto</h1>
    </header>

    <main>
                
        <!-- Formulário configurado com método GET e ação para avaliacao.html -->
        <form action="avaliacao.html" method="get">
            
            <!-- Nome do Produto (Select Dinâmico) -->
            <div class="form-group">
                <label for="produto">Nome do Produto *</label>
                <select id="produto" name="produto" required>
                    <option value="" disabled selected>Selecione um produto...</option>
                    <!-- As opções serão inseridas aqui pelo JavaScript -->
                </select>
            </div>

           <!-- Classificação Geral (Estrelas) -->
<div class="form-group">
    <label>Classificação Geral *</label>
    <div class="stars">
        <input type="radio" id="star5" name="classificacao" value="5" required><label for="star5" title="5 estrelas">★</label>
        <input type="radio" id="star4" name="classificacao" value="4" required><label for="star4" title="4 estrelas">★</label>
        <input type="radio" id="star3" name="classificacao" value="3" required><label for="star3" title="3 estrelas">★</label>
        <input type="radio" id="star2" name="classificacao" value="2" required><label for="star2" title="2 estrelas">★</label>
        <input type="radio" id="star1" name="classificacao" value="1" required><label for="star1" title="1 estrela">★</label>
    </div>
</div>

            <!-- Data de Instalação -->
            <div class="form-group">
                <label for="dataInstalacao">Data de Instalação *</label>
                <input type="date" id="dataInstalacao" name="dataInstalacao" required>
            </div>

            <!-- Recursos Úteis (Checkbox) -->
            <div class="form-group">
                <label>Quais recursos você achou úteis?</label>
                <div class="checkbox-group">
                    <div class="checkbox-item">
                        <input type="checkbox" id="facilidade" name="recursos" value="facilidade">
                        <label for="facilidade">Facilidade de Uso</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="desempenho" name="recursos" value="desempenho">
                        <label for="desempenho">Alto Desempenho</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="durabilidade" name="recursos" value="durabilidade">
                        <label for="durabilidade">Durabilidade</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="design" name="recursos" value="design">
                        <label for="design">Design Elegante</label>
                    </div>
                </div>
            </div>

            <!-- Avaliação Escrita -->
            <div class="form-group">
                <label for="avaliacaoEscrita">Sua Avaliação (Opcional)</label>
                <textarea id="avaliacaoEscrita" name="avaliacaoEscrita" rows="4" placeholder="Conte-nos mais sobre sua experiência..."></textarea>
            </div>

            <!-- Nome de Usuário -->
            <div class="form-group">
                <label for="nomeUsuario">Seu Nome (Opcional)</label>
                <input type="text" id="nomeUsuario" name="nomeUsuario" placeholder="Ex: João Silva">
            </div>

            <!-- Botão de Envio -->
            <input type="submit" value="Enviar Avaliação">
        </form>
    </main>

    <footer>
        <p>&copy; 2026 - Sistema de Avaliação de Produtos. Todos os direitos reservados.</p>
    </footer>
    
</body>
</html>
