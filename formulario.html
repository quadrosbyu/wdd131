<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Página Formulário de Marcelo Quadros  Fundamentos da Web Dinâmica.">
    <meta name="author" content="Marcelo Quadros">
    <link rel="stylesheet" href="estilos/formulario.css">
    <!-- Vinculação do JS com DEFER -->
    <script src="scripts/formulario.js" defer></script>
    <title>Avaliação de Produto</title>
    <style>
        /* Princípios de Design: Cores modernas, Contraste e Tipografia */
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
            --star-color: #eab308;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 20px; display: flex; flex-direction: column; min-height: 100vh; }
        
        main { flex: 1; max-width: 600px; width: 100%; margin: 0 auto; background: var(--card-bg); padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        h1 { margin-bottom: 20px; font-size: 1.75rem; text-align: center; color: var(--primary-color); }
        
        /* Estrutura do Formulário e Proximidade */
        .form-group { margin-bottom: 20px; display: flex; flex-direction: column; }
        label { font-weight: 600; margin-bottom: 8px; font-size: 0.95rem; }
        
        /* Inputs e Usabilidade */
        select, input[type="text"], input[type="date"], textarea {
            width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 1rem; transition: border-color 0.2s;
        }
        select:focus, input:focus, textarea:focus { outline: none; border-color: var(--primary-color); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
        
        /* Estilização das Estrelas (Radio Buttons Ocultos com Label Estilizada) */
        .rating-group { flex-direction: row; align-items: center; gap: 10px; position: relative; }
        .stars { display: flex; flex-direction: row-reverse; justify-content: flex-end; gap: 4px; }
        .stars input { display: none; }
        .stars label { font-size: 2rem; color: #cbd5e1; cursor: pointer; transition: color 0.2s; margin: 0; }
        .stars input:checked ~ label, .stars label:hover, .stars label:hover ~ label { color: var(--star-color); }

        /* Checkboxes Organizados */
        .checkbox-group { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 5px; }
        .checkbox-item { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .checkbox-item input { width: 18px; height: 18px; cursor: pointer; }
        .checkbox-item label { margin: 0; font-weight: normal; cursor: pointer; }

        /* Botão de Envio */
        input[type="submit"] {
            background-color: var(--primary-color); color: white; border: none; padding: 14px; border-radius: 6px; font-size: 1.1rem; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; transition: background 0.2s;
        }
        input[type="submit"]:hover { background-color: var(--primary-hover); }

        /* Rodapé Comum */
        footer { margin-top: 40px; text-align: center; font-size: 0.85rem; color: #64748b; padding: 20px 0; border-top: 1px solid var(--border-color); }

        /* Responsividade para Telas Maiores (Desktop) */
        @media (min-width: 480px) {
            .checkbox-group { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>
     <!-- Elemento HEADER único adicionado aqui dentro do body e antes do footer -->
    <header>
        <h1>Avaliação de Produto</h1>
    </header>

    <main>
                
        <!-- Formulário configurado com método GET e ação para avaliacao.html -->
        <form action="avaliacao.html" method="get">
            
            <!-- Nome do Produto (Select Dinâmico) -->
            <div class="form-group">
                <label for="produto">Nome do Produto *</label>
                <select id="produto" name="produto" required>
                    <option value="" disabled selected>Selecione um produto...</option>
                    <!-- As opções serão inseridas aqui pelo JavaScript -->
                </select>
            </div>

            <!-- Classificação Geral (Estrelas) -->
            <div class="form-group">
                <label>Classificação Geral *</label>
                <div class="stars">
                    <input type="radio" id="star5" name="classificacao" value="5" required><label for="star5" title="5 estrelas">&#9733;</label>
                    <input type="radio" id="star4" name="classificacao" value="4"><label for="star4" title="4 estrelas">&#9733;</label>
                    <input type="radio" id="star3" name="classificacao" value="3"><label for="star3" title="3 estrelas">&#9733;</label>
                    <input type="radio" id="star2" name="classificacao" value="2"><label for="star2" title="2 estrelas">&#9733;</label>
                    <input type="radio" id="star1" name="classificacao" value="1"><label for="star1" title="1 estrela">&#9733;</label>
                </div>
            </div>

            <!-- Data de Instalação -->
            <div class="form-group">
                <label for="dataInstalacao">Data de Instalação *</label>
                <input type="date" id="dataInstalacao" name="dataInstalacao" required>
            </div>

            <!-- Recursos Úteis (Checkbox) -->
            <div class="form-group">
                <label>Quais recursos você achou úteis?</label>
                <div class="checkbox-group">
                    <div class="checkbox-item">
                        <input type="checkbox" id="facilidade" name="recursos" value="facilidade">
                        <label for="facilidade">Facilidade de Uso</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="desempenho" name="recursos" value="desempenho">
                        <label for="desempenho">Alto Desempenho</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="durabilidade" name="recursos" value="durabilidade">
                        <label for="durabilidade">Durabilidade</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="design" name="recursos" value="design">
                        <label for="design">Design Elegante</label>
                    </div>
                </div>
            </div>

            <!-- Avaliação Escrita -->
            <div class="form-group">
                <label for="avaliacaoEscrita">Sua Avaliação (Opcional)</label>
                <textarea id="avaliacaoEscrita" name="avaliacaoEscrita" rows="4" placeholder="Conte-nos mais sobre sua experiência..."></textarea>
            </div>

            <!-- Nome de Usuário -->
            <div class="form-group">
                <label for="nomeUsuario">Seu Nome (Opcional)</label>
                <input type="text" id="nomeUsuario" name="nomeUsuario" placeholder="Ex: João Silva">
            </div>

            <!-- Botão de Envio -->
            <input type="submit" value="Enviar Avaliação">
        </form>
    </main>

    <footer>
        <p>&copy; 2026 - Sistema de Avaliação de Produtos. Todos os direitos reservados.</p>
    </footer>
    
</body>
</html>
